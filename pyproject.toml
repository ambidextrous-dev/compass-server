[project]
name = "compass-server"
version = "0.1.0"
description = "Minimal FastAPI based Compass Server"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "pytz (>=2025.2,<2026.0)",
    "shapely (>=2.1.1,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "vercel-blob (>=0.4.2,<0.5.0)"
]

[tool.ruff]
# Match Black’s default line length
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["I"]


[tool.poetry]
packages = [{include = "compass-server", from = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

